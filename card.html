:root{--bg:#ececee;--ink:#161748}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
#stage{position:fixed;inset:0;touch-action:pan-y pinch-zoom}
#stage.over{cursor:grab}
#stage.dragging{cursor:grabbing}
canvas{display:block}
#bar{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:clamp(14px,2vw,22px);padding:8px 8px 8px 22px;border-radius:999px;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.95);box-shadow:0 12px 34px rgba(22,23,72,.13),inset 0 1px 0 #fff;-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);font-family:Manrope,system-ui,sans-serif;pointer-events:none;white-space:nowrap}
#bar .hint{display:flex;flex-direction:column;gap:3px;line-height:1.15;color:#1d1e3a}
#bar .hint b{font-weight:800;font-size:14px}
#bar .hint span{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:#5b5e7a}
#bar .hint svg{width:13px;height:13px}
#flip{pointer-events:auto;font:700 14px/1 Manrope,system-ui,sans-serif;letter-spacing:.01em;color:#fff;background:#141416;border:0;padding:15px 22px;border-radius:999px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.12);display:flex;align-items:center;gap:8px;-webkit-tap-highlight-color:transparent;transition:transform .15s,background .15s}
#flip svg{width:15px;height:15px}
#flip:hover{background:#2a2a2e}
#flip:active{transform:scale(.96)}
@media (max-width:360px){#bar{padding-left:16px;gap:12px}#bar .hint b{font-size:13px}#bar .hint span{font-size:12px}#flip{padding:13px 16px;font-size:13px}}
#fallback{display:none;position:fixed;left:50%;top:calc(50% - 40px);transform:translate(-50%,-50%);width:min(64vw,90vh);height:auto}
.no3d #stage,.no3d #flip{display:none}
.no3d #bar{padding:12px 22px}
.no3d #fallback{display:block}
</style>
</head>
