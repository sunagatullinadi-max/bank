<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>РИР — карта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #ececee; --ink: #161748; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  #stage { position: fixed; inset: 0; touch-action: pan-y; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  canvas { display: block; }
  #flip {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    font: 600 13px/1 Manrope, system-ui, sans-serif; letter-spacing: .02em;
    color: var(--ink); background: rgba(255,255,255,.7); border: 1px solid rgba(22,23,72,.15);
    padding: 10px 16px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(6px);
  }
  #flip:hover { background: #fff; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<button id="flip" type="button">Перевернуть</button>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const CONFIG = {
  logoPath: 'M0.54953 0L165.35 73.64C198.79 88.59 222.37 101.46 237.68 112.81C252.35 123.68 262.3 135.51 267.91 148.49C273.41 161.27 276.16 177.55 276.16 197.49V281.12C276.16 301.09 273.44 315.9 267.91 325.7C262.29 335.67 252.35 342.15 237.68 345.1C222.35 348.2 198.79 348.34 165.35 345.27L92.1895 338.54V503.87L0.519531 513.5V0H0.54953ZM172.45 142.6L92.2195 113.71L93.1696 265.32L172.46 279.57V142.6H172.45ZM464.5 464.72L414.53 469.99V275.41L407.94 313.62L367.16 475L293.77 482.72V131.03L357.07 159.33V346.17L363.69 311.65L397.33 177.33L464.5 207.35V464.73V464.72ZM485.59 216.74L562.33 251.04C571.44 255.09 578.09 259.32 582.53 263.77C586.85 268.11 589.84 273.51 591.5 279.99C593.16 286.41 593.99 295.11 593.99 306.09V410.2C593.99 421.18 593.16 429.58 591.5 435.43C589.84 441.34 586.83 445.74 582.44 448.61C577.94 451.54 571.32 453.48 562.33 454.44L531.87 457.65V594L485.62 614.67V216.74H485.59ZM561.41 416.96V288.21L531.87 278.02L532.099 417.07L561.44 416.96H561.41Z',
  logoViewBox: [594, 615],
  inkColor: '#161748',
  frontText: ['История', 'финтех-маркетинга'],
  backText: ['Спецпроект от канала', '«Рекламная индустрия России»'],
  font: 'Manrope',
  cardColor: '#bfc0c6',
  metalness: 0.9,
  roughness: 0.34,
  lines: {
    count: 2,
    angle: -24,
    spacing: 7,
    offset: -21,
    strands: 5,
    width: 0.12,
    thickness: 0.2,
    strength: 1.0,
    grain: 1.0,
  },
  frontTextSize: 5.33,
};

const W = 8.56, H = 5.398, T = 0.076, R = 0.318;
const PX = 2048, PY = Math.round(PX * H / W);
const mm = PX / (W * 10);

function rng(seed) { return () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646; }

function canvas(w = PX, h = PY) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
}

function paintLines(r, c, seed) {
  const L = CONFIG.lines, rand = rng(seed);
  const img = r.getImageData(0, 0, PX, PY), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rand() - 0.5) * 10 * L.grain;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  r.putImageData(img, 0, 0);

  const a = L.angle * Math.PI / 180, dx = Math.cos(a), dy = Math.sin(a);
  const nx = -dy, ny = dx;
  const reach = Math.hypot(PX, PY);
  const step = L.spacing * mm;
  const offset0 = L.offset * mm - step * (L.count - 1) / 2;
  [r, c].forEach(ctx => { ctx.lineCap = 'round'; });

  for (let k = 0; k < L.count; k++) {
    const o = offset0 + k * step;
    const cx = PX / 2 + nx * o, cy = PY / 2 + ny * o;
    for (let s = 0; s < L.strands; s++) {
      const j = (rand() - 0.5) * L.width * mm;
      const lw = (0.5 + rand() * 1.1) * L.thickness;
      const al = 0.25 + rand() * 0.75;
      let t = -reach / 2;
      while (t < reach / 2) {
        const seg = 40 + rand() * 260, gap = rand() < 0.75 ? rand() * 14 : 30 + rand() * 90;
        const x1 = cx + dx * t + nx * j, y1 = cy + dy * t + ny * j;
        const x2 = cx + dx * (t + seg) + nx * j, y2 = cy + dy * (t + seg) + ny * j;
        r.strokeStyle = `rgba(255,255,255,${al * 0.32 * L.strength})`; r.lineWidth = lw;
        r.beginPath(); r.moveTo(x1, y1); r.lineTo(x2, y2); r.stroke();
        c.strokeStyle = `rgba(255,255,255,${al * 0.38 * L.strength})`; c.lineWidth = lw;
        c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
        t += seg + gap;
      }
    }
  }
}

const logo = new Path2D(CONFIG.logoPath);
function drawLogo(ctx, x, y, h) {
  const s = h / CONFIG.logoViewBox[1];
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fill(logo); ctx.restore();
}

function drawLines(ctx, lines, x, y, size, weight, lh = 1.12) {
  ctx.font = `${weight} ${size}px ${CONFIG.font}, system-ui, sans-serif`;
  ctx.textBaseline = 'alphabetic';
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * size * lh));
}

function makeSide(layout, seed) {
  const color = canvas(), rough = canvas(), metal = canvas();
  const c = color.getContext('2d'), r = rough.getContext('2d'), m = metal.getContext('2d');
  c.fillStyle = CONFIG.cardColor; c.fillRect(0, 0, PX, PY);
  const base = Math.round(CONFIG.roughness * 255);
  r.fillStyle = `rgb(${base},${base},${base})`; r.fillRect(0, 0, PX, PY);
  paintLines(r, c, seed);
  const mv = Math.round(CONFIG.metalness * 255);
  m.fillStyle = `rgb(${mv},${mv},${mv})`; m.fillRect(0, 0, PX, PY);
  layout({ c, r, m });
  return { color, rough, metal };
}

function ink(L, fn, { col = CONFIG.inkColor, rough = 0.55, metal = 0 } = {}) {
  L.c.fillStyle = col; fn(L.c);
  const rv = Math.round(rough * 255); L.r.fillStyle = `rgb(${rv},${rv},${rv})`; fn(L.r);
  const mv = Math.round(metal * 255); L.m.fillStyle = `rgb(${mv},${mv},${mv})`; fn(L.m);
}

const front = L => {
  const lh = 15 * mm;
  ink(L, ctx => drawLogo(ctx, PX - 7 * mm - lh * 594 / 615, 6.5 * mm, lh));
  const pad = 7 * mm, maxW = PX - pad * 2;
  let size = CONFIG.frontTextSize * mm;
  L.c.font = `800 ${size}px ${CONFIG.font}, system-ui, sans-serif`;
  const widest = Math.max(...CONFIG.frontText.map(t => L.c.measureText(t).width));
  if (widest > maxW) size *= maxW / widest;
  const lineH = 1.08, n = CONFIG.frontText.length;
  ink(L, ctx => drawLines(ctx, CONFIG.frontText, pad, PY - 7 * mm - (n - 1) * size * lineH, size, 800, lineH));
};

const back = L => {
  ink(L, ctx => ctx.fillRect(0, 5.5 * mm, PX, 8.6 * mm), { col: '#1c1c22', rough: 0.5, metal: 0.25 });
  const panel = (x, y, w, h) => {
    ink(L, ctx => { roundRect(ctx, x, y, w, h, 1.6 * mm); ctx.fill(); }, { col: '#efeff1', rough: 0.62, metal: 0 });
    L.c.save(); roundRect(L.c, x, y, w, h, 1.6 * mm); L.c.clip();
    L.c.strokeStyle = 'rgba(22,23,72,0.09)'; L.c.lineWidth = 0.35 * mm;
    for (let i = -h; i < w + h; i += 1.6 * mm) { L.c.beginPath(); L.c.moveTo(x + i, y); L.c.lineTo(x + i + h, y + h); L.c.stroke(); }
    L.c.restore();
  };
  panel(5.5 * mm, 18 * mm, 57 * mm, 8.5 * mm);
  panel(64.5 * mm, 18 * mm, 15.5 * mm, 8.5 * mm);
  ink(L, ctx => drawLines(ctx, CONFIG.backText, 5.5 * mm, PY - 10.6 * mm, 3 * mm, 700, 1.25));
  const lh = 9 * mm;
  ink(L, ctx => drawLogo(ctx, PX - 5.5 * mm - lh * 594 / 615, PY - 5.5 * mm - lh, lh));
};

const CHIP = { w: 1.18, h: 0.92, r: 0.13 };
function makeChip() {
  const S = 512, SH = Math.round(S * CHIP.h / CHIP.w);
  const col = canvas(S, SH), bump = canvas(S, SH), rough = canvas(S, SH);
  const c = col.getContext('2d'), b = bump.getContext('2d'), r = rough.getContext('2d');
  const g = c.createLinearGradient(0, 0, S, SH);
  g.addColorStop(0, '#e9cd7c'); g.addColorStop(0.5, '#d6b35b'); g.addColorStop(1, '#c79f45');
  c.fillStyle = g; c.fillRect(0, 0, S, SH);
  b.fillStyle = '#fff'; b.fillRect(0, 0, S, SH);
  r.fillStyle = 'rgb(60,60,60)'; r.fillRect(0, 0, S, SH);
  const lw = S * 0.012;
  const lines = [
    [0.27, 0, 0.27, 1], [0.73, 0, 0.73, 1],
    [0, 0.33, 0.27, 0.33], [0, 0.66, 0.27, 0.66],
    [0.73, 0.33, 1, 0.33], [0.73, 0.66, 1, 0.66],
    [0.27, 0.3, 0.73, 0.3], [0.27, 0.52, 0.73, 0.52],
    [0.42, 0, 0.42, 0.3], [0.58, 0, 0.58, 0.3],
    [0.5, 0.52, 0.5, 1],
  ];
  const stroke = (ctx, style) => {
    ctx.strokeStyle = style; ctx.lineWidth = lw; ctx.lineCap = 'butt';
    lines.forEach(([x1, y1, x2, y2]) => { ctx.beginPath(); ctx.moveTo(x1 * S, y1 * SH); ctx.lineTo(x2 * S, y2 * SH); ctx.stroke(); });
  };
  stroke(c, '#6b5420'); stroke(b, '#000'); stroke(r, 'rgb(170,170,170)');
  return { col, bump, rough };
}

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
scene.environmentIntensity = 1.0;

const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(-4, 6, 8); scene.add(sun);
const rim = new THREE.DirectionalLight(0xffffff, 0.6); rim.position.set(6, -3, -6); scene.add(rim);

const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);

const maxAniso = renderer.capabilities.getMaxAnisotropy();
function tex(cnv, srgb) {
  const t = new THREE.CanvasTexture(cnv);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = maxAniso; t.generateMipmaps = true;
  return t;
}

function cardShape(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

function planarUV(geo, w, h) {
  const p = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) + w / 2) / w, (p.getY(i) + h / 2) / h);
  uv.needsUpdate = true;
}

const card = new THREE.Group();
scene.add(card);

let materials = [];
function build() {
  card.clear(); materials.forEach(m => m.dispose()); materials = [];

  const bevel = 0.012;
  const bodyGeo = new THREE.ExtrudeGeometry(cardShape(W - bevel * 2, H - bevel * 2, R - bevel), {
    depth: T - bevel * 2, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 4, curveSegments: 24,
  });
  bodyGeo.translate(0, 0, -(T - bevel * 2) / 2);
  const edgeMat = new THREE.MeshPhysicalMaterial({
    color: CONFIG.cardColor, metalness: CONFIG.metalness, roughness: 0.28, clearcoat: 0.4, clearcoatRoughness: 0.2,
  });
  materials.push(edgeMat);
  card.add(new THREE.Mesh(bodyGeo, edgeMat));

  const faceGeo = new THREE.ShapeGeometry(cardShape(W - bevel * 2, H - bevel * 2, R - bevel), 24);
  planarUV(faceGeo, W, H);

  const faceMat = (side) => {
    const m = new THREE.MeshPhysicalMaterial({
      map: tex(side.color, true), roughnessMap: tex(side.rough), metalnessMap: tex(side.metal),
      color: 0xffffff, roughness: 1, metalness: 1,
      clearcoat: 0.35, clearcoatRoughness: 0.18,
    });
    materials.push(m); return m;
  };
  const z = T / 2 + 0.0004;
  const f = new THREE.Mesh(faceGeo, faceMat(makeSide(front, 11)));
  f.position.z = z; card.add(f);
  const b = new THREE.Mesh(faceGeo, faceMat(makeSide(back, 23)));
  b.rotation.y = Math.PI; b.position.z = -z; card.add(b);

  const ch = makeChip();
  const chipGeo = new THREE.ExtrudeGeometry(cardShape(CHIP.w, CHIP.h, CHIP.r), {
    depth: 0.004, bevelEnabled: true, bevelThickness: 0.002, bevelSize: 0.004, bevelSegments: 2, curveSegments: 12,
  });
  planarUV(chipGeo, CHIP.w, CHIP.h);
  const chipMat = new THREE.MeshPhysicalMaterial({
    map: tex(ch.col, true), bumpMap: tex(ch.bump), bumpScale: 1.2, roughnessMap: tex(ch.rough),
    color: 0xffffff, metalness: 1, roughness: 1,
  });
  materials.push(chipMat);
  const chip = new THREE.Mesh(chipGeo, chipMat);
  chip.position.set(-W / 2 + 0.9 + CHIP.w / 2, 0.55, T / 2 - 0.002);
  card.add(chip);
}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h;
  const fit = 1.32;
  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const distH = (H * fit / 2) / Math.tan(vFov / 2);
  const distW = (W * fit / 2) / Math.tan(vFov / 2) / camera.aspect;
  camera.position.set(0, 0, Math.max(distH, distW));
  camera.lookAt(0, 0, 0); camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

const state = { spin: 0, spinTarget: 0, vel: 0, tiltX: 0, tiltY: 0, tx: 0, ty: 0, drag: false, lastX: 0, moved: 0 };
stage.addEventListener('pointermove', e => {
  const r = stage.getBoundingClientRect();
  state.tx = ((e.clientY - r.top) / r.height - 0.5) * 0.35;
  state.ty = ((e.clientX - r.left) / r.width - 0.5) * 0.45;
  if (state.drag) {
    const dx = e.clientX - state.lastX; state.lastX = e.clientX; state.moved += Math.abs(dx);
    state.vel = dx * 0.012; state.spin += state.vel; state.spinTarget = state.spin;
  }
});
stage.addEventListener('pointerdown', e => {
  state.drag = true; state.lastX = e.clientX; state.moved = 0; state.vel = 0;
  stage.classList.add('dragging'); stage.setPointerCapture(e.pointerId);
});
const release = () => {
  if (!state.drag) return;
  state.drag = false; stage.classList.remove('dragging');
  const proj = state.spin + state.vel * 12;
  state.spinTarget = Math.round(proj / Math.PI) * Math.PI;
};
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', release);
stage.addEventListener('pointerleave', () => { state.tx = 0; state.ty = 0; });
document.getElementById('flip').addEventListener('click', () => {
  state.spinTarget = (Math.round(state.spinTarget / Math.PI) + 1) * Math.PI;
});

const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  const k = (f) => 1 - Math.pow(1 - f, dt * 60);
  if (!state.drag) state.spin += (state.spinTarget - state.spin) * k(0.08);
  state.tiltX += (state.tx - state.tiltX) * k(0.07);
  state.tiltY += (state.ty - state.tiltY) * k(0.07);
  card.rotation.set(
    state.tiltX + Math.sin(t * 0.6) * 0.04 - 0.08,
    state.spin + state.tiltY + Math.sin(t * 0.45) * 0.06,
    Math.sin(t * 0.35) * 0.015);
  card.position.y = Math.sin(t * 0.8) * 0.06;
  scene.environmentRotation.y = t * 0.12 + state.tiltY * 1.5;
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

(async () => {
  try { await document.fonts.load(`800 40px ${CONFIG.font}`); await document.fonts.load(`700 40px ${CONFIG.font}`); } catch (e) {}
  build(); resize(); tick();
})();
</script>
</body>
</html>
